<!DOCTYPE html>
<html lang="en">

<head>
  <title>Web-based Rock-Paper-Scissors vs a Neural Network</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Ariel Flesler">
  <meta name="description" content="Web-based Rock-Paper-Scissors vs a Neural Network">
  <meta name="robots" content="all" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="icon" href="favicon.ico">
  <meta name="theme-color" content="#ffffff">
</head>

<body>
  <a href="https://github.com/flesler/neural-rock-paper-scissors" target="_blank"><img loading="lazy" width="149"
      height="149" src="https://github.blog/wp-content/uploads/2008/12/forkme_right_gray_6d6d6d.png?resize=149%2C149"
      class="github-ribbon" alt="Fork me on GitHub"></a>
  <h1>Web-based Rock-Paper-Scissors vs a Neural Network</h1>
  <main>
    <div class="game-row game-row--top">
      <div id="human-choices" class="game-cell"></div>
      <aside class="ai-panel game-cell">
        <div class="ai-toolbar">
          <label class="ai-strategy">
            <span>Strategy</span>
            <select id="brain" aria-label="AI strategy"></select>
          </label>
          <button id="reset" type="button" class="reset-btn" title="Reset" aria-label="Reset">↻</button>
        </div>
        <div class="ai-scoreboard">
          <div class="score-line">
            <span class="score-stat">
              <span class="score-label">AI</span>
              <span class="score-swatch ai" aria-hidden="true"></span>
              <strong id="ai-score">0</strong>
            </span>
            <span class="score-stat">
              <span class="score-label">You</span>
              <span class="score-swatch human" aria-hidden="true"></span>
              <strong id="human-score">0</strong>
            </span>
            <span class="score-stat">
              <span class="score-label">Ties</span>
              <span class="score-swatch tie" aria-hidden="true"></span>
              <strong id="tie-score">0</strong>
            </span>
            <span class="score-stat score-rate">
              <span class="score-label">AI win rate</span>
              <strong id="ai-rate" class="rate-neutral">—</strong>
            </span>
          </div>
          <div id="score-history" class="score-history" aria-label="Round history"></div>
        </div>
      </aside>
    </div>
    <div class="game-row game-row--hands">
      <div class="game-cell game-cell--hand game-cell--human">
        <img id="human" class="choice" alt="" draggable="false">
      </div>
      <div class="game-cell game-cell--hand ai-hand-wrap">
        <img id="ai" class="choice choice--ai" alt="" draggable="false">
        <img class="busy" src="img/thinking.gif" alt="" draggable="false">
      </div>
    </div>
  </main>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/neataptic@1.4.7/dist/neataptic.js"></script>
  <script type="text/javascript" src="js/rps.js"></script>
</body>

</html>
